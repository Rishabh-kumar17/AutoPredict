version: '3.8'
services:
  frontend:
    build: ./Frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ML_INFERENCE_URL=http://ml-inference:8000/predict
    depends_on:
      - ml-inference

  ml-inference:
    build: ./ml_inference
    ports:
      - "8000:8000"
